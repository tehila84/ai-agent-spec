<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="680" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- T: trigger -->
  <rect x="240" y="20" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">פנייה חדשה מלקוח</text>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">אתר / מייל / וואטסאפ</text>
  <line x1="340" y1="76" x2="340" y2="106" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- M: Make -->
  <rect x="240" y="106" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Make</text>
  <text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">טריגר + חיבורים</text>
  <line x1="340" y1="162" x2="340" y2="192" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- AG: Claude agent -->
  <rect x="240" y="192" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#26215C">סוכן Claude</text>
  <text x="340" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">מחליט מה לעשות</text>

  <!-- branch arrows -->
  <path d="M340 248 L340 268 L200 268 L200 288" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M340 248 L340 268 L480 268 L480 288" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- R1: direct reply -->
  <rect x="110" y="288" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="200" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">מענה ישיר</text>
  <text x="200" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">לשאלה רגילה</text>

  <!-- R2: escalation -->
  <rect x="390" y="288" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="480" y="308" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">הסלמה</text>
  <text x="480" y="328" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">להיבט כספי</text>

  <!-- converge arrows -->
  <path d="M200 344 L200 364 L340 364 L340 384" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M480 344 L480 364 L340 364 L340 384" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LOG: log + dashboard -->
  <rect x="240" y="384" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="404" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">יומן + דשבורד</text>
  <text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">מסד נתונים ותצוגה</text>
</svg>
