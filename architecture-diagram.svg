<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="860" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Trigger -->
  <rect x="430" y="20" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="550" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">New message</text>
  <text x="550" y="60" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Website / Email / WhatsApp</text>
  <line x1="550" y1="76" x2="550" y2="106" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Make -->
  <rect x="430" y="106" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="550" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Make</text>
  <text x="550" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Orchestration + trigger</text>
  <line x1="550" y1="162" x2="550" y2="192" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Agent -->
  <rect x="430" y="192" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="550" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#26215C">Claude Agent</text>
  <text x="550" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Decides what to do</text>

  <!-- Data sources (left column) -->
  <rect x="60" y="104" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="190" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#042C53">Knowledge Base</text>
  <text x="190" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">FAQs &amp; policies</text>
  <path d="M320,132 L380,132 L380,205 L430,205" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="192" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="190" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#042C53">Shopify API</text>
  <text x="190" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Orders &amp; shipping</text>
  <line x1="320" y1="220" x2="430" y2="220" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="60" y="280" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="190" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#042C53">Customer Memory</text>
  <text x="190" y="320" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Per-customer summary</text>
  <path d="M320,308 L380,308 L380,235 L430,235" fill="none" stroke="#5F5E5A" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Branch to Reply / Escalate -->
  <path d="M550,248 L550,280 L490,280 L490,330" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M550,248 L550,280 L710,280 L710,330" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Reply -->
  <rect x="400" y="330" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="490" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Direct reply</text>
  <text x="490" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Sent to customer</text>

  <!-- Escalate -->
  <rect x="620" y="330" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="710" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">Escalate</text>
  <text x="710" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">escalate_to_owner</text>
  <line x1="710" y1="386" x2="710" y2="440" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Notify -->
  <rect x="620" y="440" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="710" y="460" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">Notify owner</text>
  <text x="710" y="480" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Email / WhatsApp</text>
  <line x1="710" y1="496" x2="710" y2="540" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Owner -->
  <rect x="620" y="540" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="710" y="560" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">Store owner</text>
  <text x="710" y="580" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Reviews &amp; decides</text>

  <!-- Converge to Log -->
  <path d="M490,386 L490,630 L550,630 L550,660" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M710,596 L710,630 L550,630 L550,660" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Log -->
  <rect x="450" y="660" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="550" y="680" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Interaction log</text>
  <text x="550" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Sheets / Airtable</text>
  <line x1="550" y1="716" x2="550" y2="760" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="450" y="760" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="550" y="780" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Dashboard</text>
  <text x="550" y="800" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Volume, escalation %</text>
</svg>
